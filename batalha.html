<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Batalha - Card Game</title>
    <!-- A batalha agora fica em index.html#/batalha; esta página só redireciona (mantendo ?level=N). -->
    <script>
        const level = new URLSearchParams(location.search).get('level');
        location.replace('index.html#/batalha' + (level ? '/' + encodeURIComponent(level) : ''));
    </script>
    <meta http-equiv="refresh" content="0; url=index.html#/batalha">
</head>
<body></body>
</html>
