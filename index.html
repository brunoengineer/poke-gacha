    <div id="login-root" hidden></div>

    <header class="topbar" hidden>
      <a class="brand" href="#/collection" data-i18n-label="nav.home">
        <svg class="i brand-mark" aria-hidden="true"><use href="#i-ball-color"></use></svg>
        <span class="brand-text">Poké <b>Gacha</b></span>
      </a>
      <nav class="tabs" data-i18n-label="nav.main"></nav>
      <div class="topbar-end">
        <div class="coins" id="coins">
          <svg class="i i-coin" aria-hidden="true"><use href="#i-coin"></use></svg>
          <span id="coin-amount">0</span>
        </div>
        <div class="menu-wrap">
          <button class="icon-btn account-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu"></button>
          <div class="menu" id="menu" hidden></div>
        </div>
      </div>
    </header>

    <main id="app">
      <div class="boot" id="boot">
        <div class="spinner" aria-hidden="true"></div>
      </div>
      <section class="view" id="view-collection" data-view="collection" hidden></section>
      <section class="view" id="view-capture" data-view="capture" hidden></section>
      <section class="view" id="view-battle" data-view="battle" hidden></section>
    </main>
