<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="Card game de Genshin Impact: colecione, evolua e batalhe com seus personagens favoritos.">
    <title>Genshin Impact - Card Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4dca3' d='M12 1.5l2.6 7.9 7.9 2.6-7.9 2.6L12 22.5l-2.6-7.9L1.5 12l7.9-2.6z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="preload" href="cartas.json" as="fetch" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <!-- Ícones (usados via <use href="#i-nome">) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></symbol>
            <symbol id="i-sparkle" viewBox="0 0 24 24"><path class="fill" d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/></symbol>
            <symbol id="i-swords" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"/></symbol>
            <symbol id="i-coin" viewBox="0 0 24 24"><circle class="coin-a" cx="12" cy="12" r="10"/><circle class="coin-b" cx="12" cy="12" r="6.6"/><path class="coin-c" d="M12 8.4l1.1 2.5 2.5 1.1-2.5 1.1-1.1 2.5-1.1-2.5L8.4 12l2.5-1.1z"/></symbol>
            <symbol id="i-dots" viewBox="0 0 24 24"><circle class="fill" cx="12" cy="5" r="1.8"/><circle class="fill" cx="12" cy="12" r="1.8"/><circle class="fill" cx="12" cy="19" r="1.8"/></symbol>
            <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
            <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
            <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
            <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
            <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
            <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
            <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
            <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
            <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
            <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
            <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>
        </defs>
    </svg>

    <header class="topbar">
        <a class="brand" href="#/colecao" aria-label="Início">
            <svg class="i brand-mark" aria-hidden="true"><use href="#i-sparkle"></use></svg>
            <span class="brand-text">Genshin <b>Cards</b></span>
        </a>

        <nav class="tabs" aria-label="Navegação principal">
            <a class="tab" href="#/colecao" data-view="colecao"><svg class="i" aria-hidden="true"><use href="#i-cards"></use></svg><span>Coleção</span></a>
            <a class="tab" href="#/gacha" data-view="gacha"><svg class="i" aria-hidden="true"><use href="#i-sparkle"></use></svg><span>Oração</span></a>
            <a class="tab" href="#/batalha" data-view="batalha"><svg class="i" aria-hidden="true"><use href="#i-swords"></use></svg><span>Batalha</span></a>
        </nav>

        <div class="topbar-end">
            <div class="coins" id="coins" title="Moedas">
                <svg class="i i-coin" aria-hidden="true"><use href="#i-coin"></use></svg>
                <span class="sr-only">Moedas:</span>
                <span id="coin-amount">0</span>
            </div>
            <div class="menu-wrap">
                <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
                    <svg class="i" aria-hidden="true"><use href="#i-dots"></use></svg>
                </button>
                <div class="menu" id="menu" hidden>
                    <a class="menu-item" href="https://github.com/brunoengineer" target="_blank" rel="noopener">
                        <svg class="i" aria-hidden="true"><use href="#i-github"></use></svg> Bruno Peres no GitHub
                    </a>
                    <button class="menu-item danger" id="reset-btn" type="button">
                        <svg class="i" aria-hidden="true"><use href="#i-reset"></use></svg> Resetar jogo
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main id="app">
        <div class="boot" id="boot">
            <div class="spinner" aria-hidden="true"></div>
            <p>Carregando cartas…</p>
        </div>
        <section class="view" id="view-colecao" data-view="colecao" hidden></section>
        <section class="view" id="view-gacha" data-view="gacha" hidden></section>
        <section class="view" id="view-batalha" data-view="batalha" hidden></section>
    </main>

    <aside class="dock" id="deck-dock" aria-label="Seu deck" hidden></aside>

    <footer class="site-footer">
        Desenvolvido por <a href="https://github.com/brunoengineer" target="_blank" rel="noopener">Bruno Peres</a>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
</body>
</html>
